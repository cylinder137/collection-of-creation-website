server:
  port: 8080

spring:
  application:
    name: zaowuji-back-end
  datasource:
    # ⚠️ 数据库密码一律通过环境变量 DB_PASSWORD 注入，禁止把真实密码写进本文件/提交仓库
    # 本地开发示例：setx DB_PASSWORD 你的密码  （或 PowerShell: $env:DB_PASSWORD='你的密码'）
    url: jdbc:mysql://localhost:3306/zaowuji?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # 已存在非空库时允许基于现有库做 baseline（首次接入旧库用）
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zaowuji.back.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.zaowuji.back: debug

zaowuji:
  # 管理员令牌 HMAC 签名密钥（生产环境务必通过环境变量 ZAOWUJI_ADMIN_SECRET 覆盖）
  admin-secret: ${ZAOWUJI_ADMIN_SECRET:zaowuji-dev-secret-2026}
  ai:
    # AI 客服（DeepSeek）：密钥一律通过环境变量 DEEPSEEK_API_KEY 注入，禁止写入本文件/提交仓库
    # 本地示例（PowerShell）：$env:DEEPSEEK_API_KEY='sk-xxx'   （设置后需重启后端）
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-chat
    timeout-seconds: 60

