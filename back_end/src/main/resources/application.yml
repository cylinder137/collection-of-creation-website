server:
  port: 8080

spring:
  application:
    name: zaowuji-back-end
  datasource:
    # 本地开发默认密码，部署环境请用环境变量 DB_PASSWORD 覆盖
    url: jdbc:mysql://localhost:3306/zaowuji?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:325432}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    # 已存在非空库时允许基于现有库做 baseline（首次接入旧库用）
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zaowuji.back.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.zaowuji.back: debug
