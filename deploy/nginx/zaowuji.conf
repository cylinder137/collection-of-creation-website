# ============================================================
# 造物集官网 Nginx 配置
# 架构说明：
#   1. 静态文件（html/js/css/图片）由 Nginx 直接返回，不占用后端业务线程
#   2. 客户端大量短连接由 Nginx 统一接收，通过 keepalive 长连接与后端通信，
#      减少频繁创建/销毁连接的开销
#   3. 后端返回结果做缓存（proxy_cache），重复请求直接返回缓存，
#      避免重复执行业务逻辑、查询数据库
#
# 适用：Linux 服务器部署（生产环境）
# 本地开发调试可用同配置的 Windows 版 Nginx，改 root 路径即可
# ============================================================

# 后端服务长连接池：与 Spring Boot 保持 keepalive 长连接
upstream zaowuji_backend {
    server 127.0.0.1:8080;
    keepalive 64;              # 每个 worker 维持 64 条空闲长连接
}

# 后端结果缓存（内存级，也可用 proxy_cache_path 落盘）
proxy_cache_path /var/cache/nginx/zaowuji levels=1:2 keys_zone=zaowuji_cache:10m max_size=1g inactive=5m;

server {
    listen       80;
    server_name  _;            # 部署后替换为实际域名

    # 字符集
    charset utf-8;

    # ---------- 1. 静态文件：直接由 Nginx 返回，不经过 Java 后端 ----------
    # 前端构建产物（Vue 打包后的 dist 目录）
    root /www/zaowuji/front_end/dist;
    index index.html;

    # 带 hash 的静态资源（js/css/图片）：长缓存 30 天
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 单页应用路由：非 API 且文件不存在时回退 index.html（前端 history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 2. 后端 API：反向代理 + 长连接 + 结果缓存 ----------
    location /api/ {
        # 结果缓存：GET 请求且命中时直接返回缓存，不穿透后端
        proxy_cache zaowuji_cache;
        proxy_cache_key "$request_method|$scheme|$host|$request_uri";
        # 只缓存 GET 成功响应 60 秒（产品列表/详情等只读接口）
        proxy_cache_valid 200 60s;
        # 带 Cookie/Authorization 的请求不缓存（防串数据）
        proxy_no_cache $cookie_session $http_authorization;
        proxy_cache_bypass $cookie_session $http_authorization;

        proxy_pass http://zaowuji_backend;
        proxy_http_version 1.1;   # 关键：启用 keepalive 必须 HTTP/1.1
        proxy_set_header Connection "";   # 清掉 hop-by-hop 头，复用长连接
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端超时（业务接口一般 < 3s，支付回调类放宽）
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ---------- 3. 健康检查透传（不缓存） ----------
    location = /api/health {
        proxy_pass http://zaowuji_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache off;
    }

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 限制上传体积（激活码/订单 JSON 请求体）
    client_max_body_size 1m;

    # 日志
    access_log /var/log/nginx/zaowuji_access.log;
    error_log  /var/log/nginx/zaowuji_error.log warn;
}
